# Outbound destinations. Values in ${VAR:-default} form are read from the environment.
# Routing: `sources`, `event_types` (globs on the payload's `type` field) and `when`
# predicates must all match. Transforms run pick, drop, rename, then set (templated).
# `rate_limit` is a token bucket per worker process; `circuit_breaker` opens after
# consecutive transient failures and queues deliveries until a probe succeeds.
# To rotate an outbound key, set `secret` to the new value and `previous_secret` to the old
# one; requests then carry X-Signature (new) and X-Signature-Previous (old) plus `key_id`.
event_type_field: type
destinations:
  - name: crm
    url: ${RECEIVER_URL:-http://localhost:8081}/hooks/crm
    secret: ${CRM_SECRET:-crm-dev-secret}
    sources: ["*"]
    retry:
      max_attempts: 4
      base_delay_seconds: 0.5
      max_delay_seconds: 8
      multiplier: 2
      jitter: 0.2
      timeout_seconds: 5
    rate_limit: {rate: 200, burst: 400}
    circuit_breaker: {failure_threshold: 25, recovery_seconds: 5, half_open_max: 3}
  - name: billing
    url: ${RECEIVER_URL:-http://localhost:8081}/hooks/billing
    secret: ${BILLING_SECRET:-billing-dev-secret}
    previous_secret: ${BILLING_SECRET_PREVIOUS:-}
    key_id: ${BILLING_KEY_ID:-v1}
    sources: ["orders"]
    event_types: ["order.*"]
    when:
      - {field: amount, op: gte, value: 0}
    transform:
      drop: [internal_notes]
      rename: {amount: total}
      set:
        channel: "{source}"
        reference: "{event_key}"
    retry:
      max_attempts: 6
      base_delay_seconds: 1
      max_delay_seconds: 30
      timeout_seconds: 10
    rate_limit: {rate: 20, burst: 50}
    circuit_breaker: {failure_threshold: 5, recovery_seconds: 30}
