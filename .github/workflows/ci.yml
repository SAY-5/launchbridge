name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: launchbridge
          POSTGRES_PASSWORD: launchbridge
          POSTGRES_DB: launchbridge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U launchbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://launchbridge:launchbridge@localhost:5432/launchbridge_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image tagged by git sha
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: launchbridge:${{ github.sha }}
      - name: Image starts and answers /healthz
        run: |
          docker run -d --name lb -p 8080:8080 \
            -e LAUNCHBRIDGE_WEBHOOK_SECRETS=ci=ci-secret \
            -e LAUNCHBRIDGE_ADMIN_API_KEYS=ci=ci-key \
            launchbridge:${{ github.sha }}
          for i in $(seq 1 20); do
            if python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"; then
              exit 0
            fi
            sleep 1
          done
          docker logs lb
          exit 1

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - run: terraform -chdir=deploy/terraform fmt -check -recursive
      - run: terraform -chdir=deploy/terraform init -backend=false -input=false
      - run: terraform -chdir=deploy/terraform validate
