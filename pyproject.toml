[project]
name = "launchbridge"
version = "5.1.0"
description = "Integration service with signed webhooks, PostgreSQL deduplication, bounded retries and failed-event replay"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SAY-5", email = "say.apm35@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launchbridge", "fakes", "smoke"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
extend-per-file-ignores = { "launchbridge/api.py" = ["B008"], "launchbridge/auth.py" = ["B008"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
filterwarnings = ["error::DeprecationWarning:launchbridge"]
